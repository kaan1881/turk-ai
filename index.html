<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turk-AI | Yapay Zeka Sohbet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #05070a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Üst Bar */
        header { padding: 15px; background: #0f121a; border-bottom: 2px solid #00d4ff; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        h1 { font-size: 1.4rem; color: #00d4ff; letter-spacing: 3px; text-transform: uppercase; }

        /* Sohbet Ekranı */
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 15px; font-size: 1rem; line-height: 1.5; position: relative; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .ai { align-self: flex-start; background: #1a1f2b; color: #fff; border-bottom-left-radius: 2px; border: 1px solid #333; }
        .user { align-self: flex-end; background: linear-gradient(135deg, #00d4ff, #008fb3); color: #000; font-weight: 500; border-bottom-right-radius: 2px; }

        /* Giriş Alanı */
        .input-box { padding: 15px; background: #0f121a; display: flex; gap: 10px; border-top: 1px solid #222; }
        input { flex: 1; padding: 12px 20px; border-radius: 25px; border: 1px solid #444; background: #05070a; color: white; outline: none; transition: 0.3s; }
        input:focus { border-color: #00d4ff; box-shadow: 0 0 10px rgba(0, 212, 255, 0.2); }
        button { background: #00d4ff; border: none; width: 45px; height: 45px; border-radius: 50%; color: black; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { transform: scale(1.1); background: #00fff2; }

        .typing { font-size: 0.8rem; color: #00d4ff; padding: 0 20px 10px; display: none; }
    </style>
</head>
<body>

<header>
    <h1>TURK-AI</h1>
    <span style="font-size: 0.6rem; color: #555;">v2.0 - BY KAAN1881</span>
</header>

<div id="chat-window">
    <div class="msg ai">Merhaba! Ben Turk-AI. Kaan1881 tarafından geliştirilen dijital asistanım. Senin için bugün ne yapabilirim?</div>
</div>

<div id="typing" class="typing">Turk-AI yanıt yazıyor...</div>

<div class="input-box">
    <input type="text" id="user-input" placeholder="Bir şeyler yazın..." autocomplete="off">
    <button onclick="send()">></button>
</div>

<script>
    const chat = document.getElementById('chat-window');
    const input = document.getElementById('user-input');
    const typing = document.getElementById('typing');

    input.addEventListener("keypress", (e) => { if (e.key === "Enter") send(); });

    function send() {
        const val = input.value.trim();
        if (!val) return;

        addMsg(val, 'user');
        input.value = "";
        
        typing.style.display = "block";
        
        setTimeout(() => {
            typing.style.display = "none";
            const reply = getReply(val);
            addMsg(reply, 'ai');
        }, 800);
    }

    function addMsg(text, sender) {
        const d = document.createElement('div');
        d.className = `msg ${sender}`;
        d.innerText = text;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    function getReply(txt) {
        const t = txt.toLowerCase();
        if (t.includes("selam") || t.includes("merhaba")) return "Selam! Seninle konuşmak harika.";
        if (t.includes("kimsin")) return "Ben Turk-AI, Kaan1881'in yapay zeka projesiyim.";
        if (t.includes("nasılsın")) return "Sistemlerim %100 kapasiteyle çalışıyor, harikayım! Sen nasılsın?";
        if (t.includes("kaan")) return "Kaan1881 benim mimarım. Onu çok severim!";
        if (t.includes("yapay zeka")) return "Yapay zeka gelecektir ve ben o geleceğin bir parçasıyım.";
        return "Bunu anladım! Çok ilginç, peki başka nelerden bahsetmek istersin?";
    }
</script>

</body>
</html>
