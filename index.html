<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turk-AI | Yapay Zeka Projesi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #00d4ff;
        }

        p {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #00d4ff;
            color: #000;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #00b8e6;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
        }

        .status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #00ff88;
        }
    </style>
</head>
<body>

    <h1>TURK-AI</h1>
    <p>Dünya Kupası 2026 Simülatörü ve Yapay Zeka Çözümleri</p>

    <!-- Google Play Linkini Buraya Yapıştır -->
    <a href="https://play.google.com/store/apps/details?id=SENIN_PAKET_ADIN" class="btn">
        Google Play'den İndir
    </a>

    <!-- Yazı artık "Yayında" olarak güncellendi -->
    <div class="status">● Google Play İncelemesi Tamamlandı - Yayında</div>

</body>
</html>
