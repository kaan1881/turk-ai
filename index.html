<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turk-AI | Kaan1881 Yapay Zeka Sohbet</title>
    
    <!-- Google SEO -->
    <meta name="description" content="Turk-AI: Kaan1881 tarafından geliştirilen gerçek zamanlı yapay zeka sohbet asistanı.">
    <meta name="keywords" content="Turk-AI, Kaan1881, Yapay Zeka Sohbet, AI Chat, Kaan1881 AI">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0b0e14; color: white; height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        header { padding: 20px; text-align: center; background: #151921; border-bottom: 1px solid #00d4ff; box-shadow: 0 4px 15px rgba(0, 179, 255, 0.2); }
        h1 { font-size: 1.5rem; color: #00d4ff; letter-spacing: 2px; }

        /* Sohbet Alanı */
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 18px; border-radius: 15px; line-height: 1.4; font-size: 1rem; }
        .ai { align-self: flex-start; background: #1f2530; color: #e0e0e0; border-bottom-left-radius: 2px; }
        .user { align-self: flex-end; background: #00d4ff; color: #000; font-weight: 500; border-bottom-right-radius: 2px; }

        /* Giriş Alanı */
        .input-area { padding: 20px; background: #151921; display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; border-radius: 10px; border: 1px solid #333; background: #0b0e14; color: white; outline: none; }
        input:focus { border-color: #00d4ff; }
        button { padding: 0 25px; background: #00d4ff; border: none; border-radius: 10px; color: black; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #008fb3; }

        /* Yükleniyor Efekti */
        .typing { font-style: italic; color: #555; font-size: 0.8rem; margin-left: 10px; display: none; }
    </style>
</head>
<body>

<header>
    <h1>TURK-AI</h1>
    <div style="font-size: 0.7rem; color: #555;">DEVELOPED BY KAAN1881</div>
</header>

<div id="chat-window">
    <div class="message ai">Merhaba! Ben Turk-AI. Kaan1881 tarafından geliştirildim. Sana nasıl yardımcı olabilirim?</div>
</div>

<div class="typing" id="typing">Turk-AI yazıyor...</div>

<div class="input-area">
    <input type="text" id="user-input" placeholder="Mesajınızı yazın..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">GÖNDER</button>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const typingIndicator = document.getElementById('typing');

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
        const text = userInput.value.trim();
        if (text === "") return;

        // Kullanıcı mesajını ekle
        addMessage(text, 'user');
        userInput.value = "";

        // AI Yanıtı simülasyonu
        typingIndicator.style.display = "block";
        
        setTimeout(() => {
            typingIndicator.style.display = "none";
            const response = generateAIResponse(text);
            addMessage(response, 'ai');
        }, 1000);
    }

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerText = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function generateAIResponse(input) {
        const msg = input.toLowerCase();
        
        if (msg.includes("merhaba") || msg.includes("selam")) return "Selam! Ben Turk-AI, seninle sohbet etmek için buradayım.";
        if (msg.includes("kimsin") || msg.includes("adın ne")) return "Ben Turk-AI. Kaan1881 tarafından yaratılmış bir yapay zekayım.";
        if (msg.includes("nasılsın")) return "Harikayım! Yazılım dünyasında geziniyorum. Sen nasılsın?";
        if (msg.includes("kaan")) return "Kaan1881 benim geliştiricimdir. O harika bir yazılımcı!";
        if (msg.includes("futbol") || msg.includes("maç")) return "Futbolu severim! İstersen seninle 2026 Dünya Kupası hakkında konuşabiliriz.";
        
        return "Bunu söylediğin için teşekkürler! Seni dinliyorum, devam et...";
    }
</script>

</body>
</html>
